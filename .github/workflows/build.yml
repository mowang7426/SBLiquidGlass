name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          brew update
          brew install ldid

      - name: Install RootHide Theos
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          rm -rf "$THEOS"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

          # Make sure the required Theos toolchain is present.
          "$THEOS/bin/update-theos"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"
          SDK_VERSION="17.0"
          SDK_NAME="iPhoneOS${SDK_VERSION}.sdk"
          SDK_REPO="https://github.com/xybp888/iOS-SDKs.git"

          mkdir -p "$THEOS/sdks"

          rm -rf "$RUNNER_TEMP/iOS-SDKs"
          git clone             --filter=blob:none             --no-checkout             --depth=1             "$SDK_REPO"             "$RUNNER_TEMP/iOS-SDKs"

          cd "$RUNNER_TEMP/iOS-SDKs"
          git sparse-checkout init --cone
          git sparse-checkout set "$SDK_NAME"
          git checkout

          test -d "$SDK_NAME"
          cp -R "$SDK_NAME" "$THEOS/sdks/"

          echo "Installed SDK:"
          ls -ld "$THEOS/sdks/$SDK_NAME"

      - name: Check build environment
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS"
          echo "Available SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo "Xcode:"
          xcodebuild -version

          echo "Clang:"
          xcrun --sdk iphoneos clang --version

      - name: Build RootHide package
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Build Rootless package
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tweak-packages
          path: packages/*.deb
          if-no-files-found: error
