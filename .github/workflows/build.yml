name: Build tweak
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build tweak
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 16.5
      THEOS_SDK_VERSION: 16.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          set -e
          brew install ldid make
      - name: Install RootHide Theos
        run: |
          set -e
          rm -rf "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos             -o "$RUNNER_TEMP/install-theos"
          bash "$RUNNER_TEMP/install-theos"
          test -d "$THEOS"
          echo "Theos installed: $THEOS"
      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"
          rm -f "$SDK_ARCHIVE"
          echo "Downloading iPhoneOS16.5.sdk..."
          curl -fL --retry 3 --retry-delay 2             "$SDK_URL"             -o "$SDK_ARCHIVE"
          echo "Extracting SDK..."
          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          echo "SDK installed successfully:"
          du -sh "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"
      - name: Verify Theos and SDK
        run: |
          set -e
          echo "=== Environment ==="
          echo "THEOS=$THEOS"
          echo "SDKVERSION=$SDKVERSION"
          echo "THEOS_SDK_VERSION=$THEOS_SDK_VERSION"
          echo "=== SDK directories ==="
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print
          echo "=== Required SDK ==="
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Theos ==="
          test -x "$THEOS/bin/make"
          "$THEOS/bin/make" --version || true
      - name: Build RootHide package
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          export SDKVERSION=16.5
          export THEOS_SDK_VERSION=16.5
          echo "Building with:"
          echo "THEOS=$THEOS"
          echo "SDKVERSION=$SDKVERSION"
          echo "SDK=$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          "$THEOS/bin/make" clean
          "$THEOS/bin/make" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: List generated packages
        run: |
          set -e
          find packages -maxdepth 1 -type f -print || true
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tweak-packages
          path: packages/*.deb
          if-no-files-found: error
